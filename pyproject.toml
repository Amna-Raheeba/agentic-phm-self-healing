[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-phm-self-healing"
version = "0.3.0"
description = "Agentic, explainable predictive maintenance with counterfactual repair planning and a human approval gate (synthetic data)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Amna Raheeba" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
dashboard = ["streamlit>=1.36"]
langgraph = ["langgraph>=0.2"]
data = ["numpy", "pandas"]

[tool.setuptools.packages.find]
include = ["phm_agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
